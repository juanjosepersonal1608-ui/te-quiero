<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oye, te quiero decir algo...</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Pacifico & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }
    .font-romantic {
      font-family: 'Pacifico', cursive;
    }
    /* Animación de corazones flotantes en segundo plano */
    .heart-bg {
      position: absolute;
      pointer-events: none;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.5) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }
    /* Estilo para los pulsos del botón */
    .pulse-glow {
      animation: pulseGlow 2s infinite;
    }
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(244, 63, 94, 0.6), 0 0 30px rgba(244, 63, 94, 0.4);
      }
      50% {
        box-shadow: 0 0 25px rgba(244, 63, 94, 0.9), 0 0 50px rgba(244, 63, 94, 0.7);
      }
    }
    /* Animaciones para las tarjetas */
    .fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }
    .pop-in {
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5); }
      70% { transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-rose-100 via-pink-200 to-purple-300 min-h-screen flex items-center justify-center p-4 relative overflow-hidden select-none">

  <!-- Contenedor para corazones flotantes continuos -->
  <div id="heartsContainer" class="absolute inset-0 pointer-events-none z-0"></div>

  <!-- PANTALLA 1: Mensaje Inicial -->
  <main id="screen1" class="z-10 text-center max-w-lg w-full bg-white/70 backdrop-blur-md p-8 sm:p-12 rounded-3xl shadow-2xl border border-white/50 transition-all duration-500 pop-in">
    <!-- Icono decorativo -->
    <div class="inline-flex items-center justify-center w-20 h-20 bg-rose-500/10 rounded-full mb-6 text-rose-500 animate-bounce">
      <i data-lucide="mail-heart" class="w-10 h-10"></i>
    </div>

    <!-- Título principal -->
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-romantic text-rose-600 mb-4 leading-tight">
      Oye, te quiero decir algo... mi princesa hermosa  👑
    </h1>
    
    <p class="text-gray-600 text-sm sm:text-base mb-8">
      Hay algo muy especial que llevo guardado en el corazón solo para ti  y quiero que lo sepas ✨
    </p>

    <!-- Botón de interacción -->
    <button id="revealBtn" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold text-lg sm:text-xl rounded-full shadow-lg transform hover:-translate-y-1 active:translate-y-0 transition-all duration-300 pulse-glow flex items-center justify-center gap-3 mx-auto">
      <span>Dale clik para saber que es </span>
      <i data-lucide="sparkles" class="w-6 h-6"></i>
    </button>
  </main>

  <!-- PANTALLA 2: Mensaje de Revelación (Oculta al principio) -->
  <main id="screen2" class="hidden z-10 text-center max-w-lg w-full bg-white/85 backdrop-blur-md p-8 sm:p-12 rounded-3xl shadow-2xl border border-rose-200 transition-all duration-500">
    <!-- Corazón / Corona animada -->
    <div class="relative inline-block mb-6">
      <div class="absolute -top-6 left-1/2 -translate-x-1/2 text-yellow-500 animate-pulse">
        <i data-lucide="crown" class="w-12 h-12"></i>
      </div>
      <div class="w-24 h-24 bg-gradient-to-tr from-rose-400 to-pink-500 rounded-full flex items-center justify-center text-white shadow-xl mx-auto mt-4">
        <i data-lucide="heart" class="w-14 h-14 fill-current animate-ping opacity-75 absolute"></i>
        <i data-lucide="heart" class="w-14 h-14 fill-current relative z-10"></i>
      </div>
    </div>

    <!-- Mensaje Romántico Destacado -->
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-600 via-pink-600 to-purple-600 mb-4 leading-snug">
      ¡TE AMOOOOO MUCHO MUCHO PRINCESA! 👑❤️
    </h1>

    <p class="text-gray-700 text-base sm:text-lg mb-8 font-medium">
      Eres la persona más especial del mundo entero. Nunca lo olvides. ✨🌸
    </p>

    <!-- Botones de Acción Extra -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
      <button id="moreConfettiBtn" class="w-full sm:w-auto px-6 py-3 bg-pink-100 hover:bg-pink-200 text-pink-700 font-semibold rounded-full shadow-md transition-all duration-300 flex items-center justify-center gap-2">
        <i data-lucide="heart-handshake" class="w-5 h-5"></i>
        <span>¡Más amor! 💕</span>
      </button>

      <button id="restartBtn" class="w-full sm:w-auto px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold rounded-full shadow-sm transition-all duration-300 flex items-center justify-center gap-2">
        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
        <span>Volver al inicio</span>
      </button>
    </div>
  </main>

  <!-- Lógica JavaScript -->
  <script>
    // Inicializar Iconos Lucide
    lucide.createIcons();

    const screen1 = document.getElementById('screen1');
    const screen2 = document.getElementById('screen2');
    const revealBtn = document.getElementById('revealBtn');
    const restartBtn = document.getElementById('restartBtn');
    const moreConfettiBtn = document.getElementById('moreConfettiBtn');
    const heartsContainer = document.getElementById('heartsContainer');

    // Función para crear corazones flotantes de fondo
    function createFloatingHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-bg');
      
      // Lista de íconos o emojis de corazones
      const heartIcons = ['💖', '💗', '💕', '🌸', '👑', '✨', '❤️'];
      heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];

      // Posición horizontal aleatoria
      heart.style.left = Math.random() * 100 + 'vw';
      // Tamaño aleatorio
      heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
      // Duración aleatoria de animación
      const duration = Math.random() * 4 + 4;
      heart.style.animationDuration = duration + 's';

      heartsContainer.appendChild(heart);

      // Eliminar el elemento cuando termine la animación
      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    // Generar corazones flotantes cada cierto intervalo
    setInterval(createFloatingHeart, 400);

    // Función para lanzar confeti romántico
    function launchRomanticConfetti() {
      // Disparar confeti con forma de corazón y colores rosas/rojos
      const duration = 3 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#f43f5e', '#ec4899', '#d8b4fe', '#ffffff', '#fb7185'],
          shapes: ['square']
        });
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#f43f5e', '#ec4899', '#d8b4fe', '#ffffff', '#fb7185'],
          shapes: ['square']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();

      // Explosión central
      setTimeout(() => {
        confetti({
          particleCount: 80,
          spread: 100,
          origin: { y: 0.6 },
          colors: ['#f43f5e', '#ec4899', '#e11d48', '#ffd700']
        });
      }, 300);
    }

    // Evento al presionar el botón de revelación
    revealBtn.addEventListener('click', () => {
      // Transición entre pantallas
      screen1.classList.add('opacity-0', 'scale-95');
      
      setTimeout(() => {
        screen1.classList.add('hidden');
        screen1.classList.remove('opacity-0', 'scale-95');

        screen2.classList.remove('hidden');
        screen2.classList.add('pop-in');

        // Disparar confeti
        launchRomanticConfetti();
      }, 300);
    });

    // Botón para repetir confeti
    moreConfettiBtn.addEventListener('click', () => {
      launchRomanticConfetti();
    });

    // Evento al reiniciar
    restartBtn.addEventListener('click', () => {
      screen2.classList.add('opacity-0', 'scale-95');

      setTimeout(() => {
        screen2.classList.add('hidden');
        screen2.classList.remove('opacity-0', 'scale-95', 'pop-in');

        screen1.classList.remove('hidden');
        screen1.classList.add('pop-in');
      }, 300);
    });
  </script>
</body>
</html>
